name: semantic-v1-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run semantic regression suite
        run: python -B -m unittest discover -s scripts -p "test_semantic_v1.py" -v
      - name: Check command-line entry points
        run: |
          python -B scripts/semantic_model.py --help
          python -B scripts/semantic_experiment.py --help
