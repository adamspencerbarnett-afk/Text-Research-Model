name: compiler-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4   # LFS files (the model) are not downloaded: the tests do not need them
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "numpy>=2.2"
      - name: Run Compiler v0 encoder suite
        shell: bash
        run: |
          set -o pipefail
          g++ --version | head -1 || echo "no g++: native parity tests will be skipped"
          python -B -m unittest compiler/test_compiler_v0.py -v 2>&1 | tee test-output.txt
      - name: Run encoder ladder suite
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest compiler/experiments/test_ladder.py -v 2>&1 | tee -a test-output.txt
      - name: Report failing tests as annotations
        if: failure()
        run: python .github/scripts/annotate_test_failures.py test-output.txt
